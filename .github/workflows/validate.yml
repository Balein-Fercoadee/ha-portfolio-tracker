name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements_test.txt
      - run: python -m pytest -p no:sugar --force-enable-socket
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --check custom_components/portfolio_tracker/www/portfolio-tracker.js
      - run: node --test tests/frontend.test.cjs

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: topics
